{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        nav {
            background-color: white;
            padding: 18px 0;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav a:hover {
            color: #0077ff;
        }

        .container {
            max-width: 850px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .post-card {
            background-color: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 38px;
            margin-top: 0;
        }

        .date {
            color: #777;
            margin-bottom: 30px;
        }

        .content {
            font-size: 18px;
            line-height: 1.8;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #0077ff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <a href="/about_me/">About me</a>
        <a href="/todo/">Todo</a>
    </nav>

    <div class="container">
        <div class="post-card">
            <h1>{{ post.title }}</h1>
            <p class="date">{{ post.created_at }}</p>

            <div class="content">
                {{ post.content|linebreaks }}
            </div>

            <a class="back" href="/blog/">목록으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
