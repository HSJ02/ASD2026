{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>STUDY</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        nav {
            background-color: white;
            padding: 18px 0;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        nav a:hover {
            color: #0077ff;
        }

        .container {
            max-width: 850px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .post-card {
            background-color: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .category {
            display: inline-block;
            background-color: #222;
            color: white;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            margin-top: 0;
        }

        .date {
            color: #777;
            margin-bottom: 30px;
        }

        .content {
            font-size: 18px;
            line-height: 1.8;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #0077ff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <a href="/about_me/">About me</a>
        <a href="/todo/">Todo</a>
    </nav>

    <div class="container">
        <div class="post-card">
            <span class="category">Study</span>
            <h1>STUDY</h1>
            <p class="date">기존 블로그 게시물</p>

            <div class="content">
                <p>
                    응용소프트웨어를 배우고 있습니다.
                </p>
                <p>
                    수업에서 배운 개념과 직접 실습한 내용을 기록하며,
                    개발자로 성장하는 과정을 차곡차곡 남기고자 합니다.
                </p>
                <p>
                    물론 제가 적어나갈지는 스스로 좀 의심스럽긴 하네요
                    하지만 정진해보겠습니다. 
                </p>
            </div>

            <a class="back" href="/blog/">목록으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
